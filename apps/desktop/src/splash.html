<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabric</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
      }

      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: transparent;
      }

      .splash {
        display: flex;
        width: 320px;
        min-height: 230px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.72);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.48);
        backdrop-filter: blur(22px);
      }

      .logo {
        width: 72px;
        height: 72px;
        animation: logo-breathe 2.2s ease-in-out infinite;
      }

      .status-list {
        display: grid;
        width: 100%;
        gap: 7px;
        margin-top: 2px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.42);
        font-size: 11px;
        line-height: 1;
        opacity: 0;
        transform: translateY(4px);
        animation: status-cycle 6s ease-in-out infinite;
      }

      .status:nth-child(2) {
        animation-delay: 1.2s;
      }

      .status:nth-child(3) {
        animation-delay: 2.4s;
      }

      .status:nth-child(4) {
        animation-delay: 3.6s;
      }

      .dot {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.22);
      }

      .bar {
        width: 100%;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .bar::before {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.92));
        animation: loading-bar 1.8s ease-in-out infinite;
        content: "";
      }

      @keyframes logo-breathe {
        0%,
        100% {
          transform: scale(0.97);
          opacity: 0.82;
        }

        50% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes status-cycle {
        0%,
        100% {
          opacity: 0;
          transform: translateY(4px);
        }

        12%,
        38% {
          opacity: 1;
          transform: translateY(0);
          color: rgba(255, 255, 255, 0.86);
        }
      }

      @keyframes loading-bar {
        0% {
          transform: translateX(-105%);
        }

        55% {
          transform: translateX(75%);
        }

        100% {
          transform: translateX(245%);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <img class="logo" src="./assets/icon.svg" alt="Fabric" />
      <div class="status-list" aria-label="Startup status">
        <div class="status"><span class="dot"></span><span>Starting local services</span></div>
        <div class="status"><span class="dot"></span><span>Waiting for gateway</span></div>
        <div class="status"><span class="dot"></span><span>Loading workspace profile</span></div>
        <div class="status"><span class="dot"></span><span>Opening Fabric</span></div>
      </div>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
