<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabric</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
      }

      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: rgba(17, 19, 24, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
      }

      .splash {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .logo {
        width: 76px;
        height: 76px;
        animation: pulse 1.8s ease-in-out infinite;
      }

      .ring {
        width: 108px;
        height: 108px;
        position: absolute;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-top-color: rgba(255, 255, 255, 0.58);
        animation: spin 1.2s linear infinite;
      }

      .brand {
        color: rgba(255, 255, 255, 0.86);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.96);
          opacity: 0.78;
        }

        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <div class="ring"></div>
      <img class="logo" src="./assets/icon.svg" alt="Fabric" />
      <div class="brand">Fabric</div>
    </main>
  </body>
</html>
