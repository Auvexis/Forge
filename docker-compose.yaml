services:
  fabric-server:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fabric-server
    ports:
      - "23801:23801"
    environment:
      - FABRIC_HOME=/app/.fabric
      - FABRIC_PUBLIC_URL=${FABRIC_PUBLIC_URL:-}
      - FABRIC_PUBLIC_URL_LOCKED=${FABRIC_PUBLIC_URL_LOCKED:-false}
    volumes:
      - fabric_data:/app/.fabric
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:23801/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  fabric-client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: fabric-client
    ports:
      - "23802:23802"
    depends_on:
      fabric-server:
        condition: service_healthy
    restart: always

volumes:
  fabric_data:
