services:
  fabric-gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: fabric-gateway
    ports:
      - "23800:23800"
    environment:
      - FABRIC_API_ORIGIN=http://fabric-server:23801
      - FABRIC_CLIENT_ORIGIN=http://fabric-client:23802
      - FABRIC_GATEWAY_PORT=23800
    depends_on:
      fabric-server:
        condition: service_healthy
      fabric-client:
        condition: service_started
    restart: always

  fabric-server:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fabric-server
    ports:
      - "23801:23801"
    environment:
      - FABRIC_HOME=/app/.fabric
      - FABRIC_PUBLIC_URL=${FABRIC_PUBLIC_URL:-http://localhost:23800}
      - FABRIC_PUBLIC_URL_LOCKED=${FABRIC_PUBLIC_URL_LOCKED:-false}
    volumes:
      - fabric_data:/app/.fabric
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:23801/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  fabric-client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: fabric-client
    ports:
      - "23802:23802"
    depends_on:
      fabric-server:
        condition: service_healthy
    restart: always

volumes:
  fabric_data:
