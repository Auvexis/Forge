services:
  sailor-server:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sailor-server
    ports:
      - "23801:23801"
    environment:
      - SAILOR_HOME=/app/.sailor
    volumes:
      - sailor_data:/app/.sailor
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:23801/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  sailor-client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:23801
    container_name: sailor-client
    ports:
      - "23802:23802"
    depends_on:
      sailor-server:
        condition: service_healthy
    restart: always

volumes:
  sailor_data:
