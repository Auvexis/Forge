version: '3.8'

services:
  forge-server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: forge-server
    ports:
      - "23801:23801"
    volumes:
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:23801/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  forge-client:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: forge-client
    ports:
      - "23802:23802"
    environment:
      - VITE_API_BASE_URL=http://localhost:23801
    depends_on:
      forge-server:
        condition: service_healthy
    restart: always
