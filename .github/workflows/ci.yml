name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  test-build:
    name: Test and build (${{ matrix.workspace.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - label: API
            name: fabric
          - label: Client
            name: client
          - label: Gateway
            name: "@fabric/gateway"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check --workspace ${{ matrix.workspace.name }}

      - name: Run Vitest suites
        run: npm run test:vitest --workspace ${{ matrix.workspace.name }}

      - name: Run Node test suites
        run: npm run test:node --workspace ${{ matrix.workspace.name }}

      - name: Build workspace
        run: npm run build --workspace ${{ matrix.workspace.name }}

  docker-build:
    name: Docker build (${{ matrix.image.label }})
    runs-on: ubuntu-latest
    needs: test-build
    strategy:
      fail-fast: false
      matrix:
        image:
          - label: API
            container: api
            dockerfile: apps/api/Dockerfile
            tag: fabric-api:ci
            port: 23801
            path: /
          - label: Client
            container: client
            dockerfile: apps/client/Dockerfile
            tag: fabric-client:ci
            port: 23802
            path: /
          - label: Gateway
            container: gateway
            dockerfile: apps/gateway/Dockerfile
            tag: fabric-gateway:ci
            port: 23800
            path: /

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.image.dockerfile }} -t ${{ matrix.image.tag }} .

      - name: Smoke test image
        run: |
          docker run --rm -d --name fabric-smoke-${{ matrix.image.container }} -p ${{ matrix.image.port }}:${{ matrix.image.port }} ${{ matrix.image.tag }}
          for attempt in {1..20}; do
            if curl --silent --show-error http://localhost:${{ matrix.image.port }}${{ matrix.image.path }} >/tmp/fabric-smoke-response.txt; then
              docker rm -f fabric-smoke-${{ matrix.image.container }}
              exit 0
            fi
            sleep 1
          done
          docker logs fabric-smoke-${{ matrix.image.container }}
          docker rm -f fabric-smoke-${{ matrix.image.container }}
          exit 1
