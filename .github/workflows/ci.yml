name: CI

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  test-build:
    name: Test and build (${{ matrix.workspace.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - label: API
            name: "@fabric/api"
          - label: Client
            name: client
          - label: Gateway
            name: "@fabric/gateway"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check --workspace ${{ matrix.workspace.name }}

      - name: Run Vitest suites
        run: npm run test:vitest --workspace ${{ matrix.workspace.name }}

      - name: Run Node test suites
        run: npm run test:node --workspace ${{ matrix.workspace.name }}

      - name: Build workspace
        run: npm run build --workspace ${{ matrix.workspace.name }}

  docker-build:
    name: Docker build (${{ matrix.image.label }})
    runs-on: ubuntu-latest
    needs: test-build
    strategy:
      fail-fast: false
      matrix:
        image:
          - label: API
            container: api
            dockerfile: apps/api/Dockerfile
            tag: fabric-api:ci
            host-port: 23801
            container-port: 23801
            path: /
          - label: Client
            container: client
            dockerfile: apps/client/Dockerfile
            tag: fabric-client:ci
            host-port: 23802
            container-port: 80
            path: /home
          - label: Gateway
            container: gateway
            dockerfile: apps/gateway/Dockerfile
            tag: fabric-gateway:ci
            host-port: 23800
            container-port: 23800
            path: /home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.image.dockerfile }} -t ${{ matrix.image.tag }} .

      - name: Smoke test image
        run: |
          docker run --rm -d --name fabric-smoke-${{ matrix.image.container }} -p ${{ matrix.image.host-port }}:${{ matrix.image.container-port }} ${{ matrix.image.tag }}
          for attempt in {1..20}; do
            if curl --silent --show-error http://localhost:${{ matrix.image.host-port }}${{ matrix.image.path }} >/tmp/fabric-smoke-response.txt; then
              docker rm -f fabric-smoke-${{ matrix.image.container }}
              exit 0
            fi
            sleep 1
          done
          docker logs fabric-smoke-${{ matrix.image.container }}
          docker rm -f fabric-smoke-${{ matrix.image.container }}
          exit 1

  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    needs: test-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate npm publish
        run: npm publish --dry-run --tag alpha --access public

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: test-build
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Build release artifacts
        run: npm run build

      - name: Run E2E smoke
        run: npm run test:e2e

  npm-publish:
    name: npm publish
    runs-on: ubuntu-latest
    needs: npm-package
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-alpha.')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish alpha package
        run: npm publish --tag alpha --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-publish:
    name: Docker publish (${{ matrix.image.label }})
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        image:
          - label: API
            name: fabric-api
            dockerfile: apps/api/Dockerfile
          - label: Client
            name: fabric-client
            dockerfile: apps/client/Dockerfile
          - label: Gateway
            name: fabric-gateway
            dockerfile: apps/gateway/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/auvexis/${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
