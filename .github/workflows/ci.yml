name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  test-build:
    name: Test and build (${{ matrix.workspace.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - label: API
            name: fabric
          - label: Client
            name: client
          - label: Gateway
            name: "@fabric/gateway"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check --workspace ${{ matrix.workspace.name }}

      - name: Run Vitest suites
        run: npm run test:vitest --workspace ${{ matrix.workspace.name }}

      - name: Run Node test suites
        run: npm run test:node --workspace ${{ matrix.workspace.name }}

      - name: Build workspace
        run: npm run build --workspace ${{ matrix.workspace.name }}

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t fabric-api:ci .

      - name: Build client image
        run: docker build -f apps/client/Dockerfile -t fabric-client:ci .

      - name: Build gateway image
        run: docker build -f apps/gateway/Dockerfile -t fabric-gateway:ci .
