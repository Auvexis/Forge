name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  test-build:
    name: Test and build (${{ matrix.workspace.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - label: API
            name: fabric
          - label: Client
            name: client
          - label: Gateway
            name: "@fabric/gateway"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check --workspace ${{ matrix.workspace.name }}

      - name: Run Vitest suites
        run: npm run test:vitest --workspace ${{ matrix.workspace.name }}

      - name: Run Node test suites
        run: npm run test:node --workspace ${{ matrix.workspace.name }}

      - name: Build workspace
        run: npm run build --workspace ${{ matrix.workspace.name }}

  docker-build:
    name: Docker build (${{ matrix.image.label }})
    runs-on: ubuntu-latest
    needs: test-build
    strategy:
      fail-fast: false
      matrix:
        image:
          - label: API
            dockerfile: apps/api/Dockerfile
            tag: fabric-api:ci
          - label: Client
            dockerfile: apps/client/Dockerfile
            tag: fabric-client:ci
          - label: Gateway
            dockerfile: apps/gateway/Dockerfile
            tag: fabric-gateway:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.image.dockerfile }} -t ${{ matrix.image.tag }} .
